// Shared by common, neoforge and fabric (after the MultiLoader template by jaredlll08)
plugins {
    id 'java-library'
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}"

base {
    // Ceramics-neoforge (the old name), Ceramics-fabric
    archivesName = project.name == 'common' ? 'Ceramics-common' : "Ceramics-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenLocal() // Kilnwork (./gradlew publishToMavenLocal in the kilnwork repository, branch of the same Minecraft version)
    mavenCentral()
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

jar {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    from(rootProject.file('licenses')) { into "licenses/${mod_id}" }
}

processResources {
    var expandProps = [
            'mod_version'            : mod_version,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'neo_version_range'      : neo_version_range,
            'fabric_loader_version'  : fabric_loader_version,
            'fabric_version'         : fabric_version,
            'kilnwork_range'         : kilnwork_range,
            'kilnwork_fabric_range'  : kilnwork_fabric_range,
            'mod_authors'            : mod_authors,
            'mod_name'               : mod_name,
            'mod_id'                 : mod_id,
            'mod_license'            : mod_license,
            'java_version'           : java_version,
    ]
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
