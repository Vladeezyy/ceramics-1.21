plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'Ceramics-neoforge'
}

repositories {
    mavenLocal() // Kilnwork (./gradlew publishToMavenLocal in the kilnwork repository)
    maven { url = 'https://maven.blamejared.com/' } // JEI
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources.srcDir 'src/generated/resources'

// Functional self-test (src/selftest): loaded in dev runs only, never part of the jar
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    selftestImplementation.extendsFrom implementation
    selftestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // tools/scenetest.sh: client scene with screenshots in run/screenshots (src/selftest)
        scene {
            client()
            systemProperty 'ceramics.scene', 'true'
        }
        // tools/selftest.sh: functional checks on a fresh world, then stops (src/selftest)
        selftest {
            server()
            programArgument '--nogui'
            systemProperty 'ceramics.selftest', 'true'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.vladeezyy:kilnwork:${kilnwork_version}"
    // Kilnwork ships inside the jar, NeoForge picks the newest copy if another mod brings one
    jarJar("dev.vladeezyy:kilnwork") {
        version {
            strictly "[${kilnwork_version},)"
            prefer kilnwork_version
        }
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            kilnwork_range         : kilnwork_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.addModdingDependenciesTo(sourceSets.selftest)

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_ceramics' } }
    from('licenses') { into 'licenses/ceramics' }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
